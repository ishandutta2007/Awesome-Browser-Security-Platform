<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .grid-line { stroke: #334155; stroke-opacity: 0.3; stroke-width: 1; }
    .pulse-circle { animation: pulse 3s infinite ease-in-out; }
    @keyframes pulse {
      0% { r: 120px; opacity: 0.15; }
      50% { r: 150px; opacity: 0.35; }
      100% { r: 120px; opacity: 0.15; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Grid -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="350" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="350" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="350" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="350" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="350" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="350" class="grid-line" />
    
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Background Dynamic Elements (Glowing Orbs behind text) -->
  <circle cx="980" cy="175" r="130" fill="#6366f1" class="pulse-circle" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1050" cy="120" r="80" fill="#06b6d4" opacity="0.2" filter="url(#glow)"/>

  <!-- Right Side Graphic: Browser Isolation Shield & Nodes -->
  <g transform="translate(850, 60)">
    <!-- Browser Window Frame -->
    <rect x="0" y="0" width="260" height="180" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="#1e293b"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="35" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="15" r="5" fill="#10b981"/>
    <rect x="70" y="8" width="170" height="14" rx="4" fill="#0f172a"/>

    <!-- Isolated Container Layer -->
    <rect x="25" y="45" width="210" height="115" rx="6" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Shield Icon -->
    <path d="M 130 65 L 170 80 V 115 C 170 140 130 155 130 155 C 130 155 90 140 90 115 V 80 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M 120 110 L 127 117 L 142 100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Content (Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="65" width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="86" class="badge-text">🛡️ ENTERPRISE SECURITY PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome Browser Security</text>
    
    <!-- Gradient Line Accent -->
    <rect x="0" y="175" width="550" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="220" class="subtitle">Curated Enterprise Browser Isolation, Web Security &amp;</text>
    <text x="0" y="250" class="subtitle">Zero Trust Threat Protection Ecosystem</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="15" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🌐 Enterprise RBI</text>

      <rect x="140" y="0" width="150" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="155" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔒 Threat Detection</text>

      <rect x="300" y="0" width="150" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="315" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ Open Source &amp; SaaS</text>
    </g>
  </g>
</svg>
